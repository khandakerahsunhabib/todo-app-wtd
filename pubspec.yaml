name: wtd
description: What to do (WTD) is a todo app to save your daily task

publish_to: 'none'

version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get: ^4.7.2
  share_plus: ^13.1.0
  path_provider: ^2.0.15
  http: ^1.6.0
  fluttertoast: ^9.0.0
  url_launcher: ^6.1.11
  lottie: ^3.3.3
  pdf: ^3.10.8
  change_app_package_name: ^1.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.3.3
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/wtd-logo.png"
  
flutter:
  uses-material-design: true
  assets:
   - assets/images/
   - assets/images/habib.jpg
   - assets/animations/
   
  fonts:
    - family: MYRIADPRO
      fonts:
        - asset: assets/fonts/MYRIADPRO-REGULAR.OTF